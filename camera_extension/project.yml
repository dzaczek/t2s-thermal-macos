name: T2SCamera
options:
  bundleIdPrefix: cat.sysop.t2scamera
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    # System Extensions are version-tracked by macOS (OSSystemExtensionProperties
    # exposes bundleShortVersion/bundleVersion, and replacement decisions compare
    # them). Without these, the built Info.plist had no CFBundleVersion /
    # CFBundleShortVersionString at all and activation failed with "Unable to
    # find any matched extension" -- confirmed by diffing against a working
    # camera extension already installed on this machine.
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"

targets:
  T2SCameraApp:
    type: application
    platform: macOS
    sources:
      - path: T2SCameraApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cat.sysop.t2scamera
        PRODUCT_NAME: T2SCamera
        CODE_SIGN_ENTITLEMENTS: T2SCameraApp/T2SCameraApp.entitlements
        # Required for the camera permission prompt; without it macOS denies
        # access outright rather than asking.
        INFOPLIST_KEY_NSCameraUsageDescription: "Shows the live image from the T2S+ thermal camera."
        INFOPLIST_KEY_NSSystemExtensionUsageDescription: "Installs the virtual camera so the thermal view can be used in Teams, Zoom and FaceTime."
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        # Icon set is generated by make_icon.swift; see the README.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: T2SCameraExtension
        embed: true

  T2SCameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: T2SCameraExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cat.sysop.t2scamera.extension
        PRODUCT_NAME: cat.sysop.t2scamera.extension
        INFOPLIST_FILE: T2SCameraExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: T2SCameraExtension/T2SCameraExtension.entitlements
        SKIP_INSTALL: YES
